<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Opulence Restaurant - Premium Restaurant Management System">
    <title>Opulence | Restaurant Management</title>

    <!-- Security Headers -->
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' 'unsafe-inline' https://cdn.tailwindcss.com https://cdnjs.cloudflare.com https://fonts.googleapis.com; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; img-src 'self' data: https:; font-src https://fonts.gstatic.com https://cdnjs.cloudflare.com; connect-src 'self' https=">

    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>

    <!-- Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;600;700&display=swap" rel="stylesheet">

    <!-- Font Awesome Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

    <!-- Custom Styles -->
    <link rel="stylesheet" href="/css/styles.css">

    <style>
        body {
            font-family: 'Plus Jakarta Sans', sans-serif;
            background-color: #0F0F11;
            color: #E4E4E7;
        }
    </style>
</head>
<body class="custom-scrollbar">

<div id="app" class="min-h-screen">

    <!--========== AUTHENTICATION SECTION ==========-->
    <div data-section="auth" class="hidden min-h-screen bg-gradient-to-br from-zinc-900 via-black to-zinc-900 flex items-center justify-center p-4">
        <div class="w-full max-w-md">
            <div class="text-center mb-8">
                <h1 class="text-4xl font-bold text-white mb-2">
                    <i class="fas fa-utensils text-rose-600 mr-3"></i>Opulence
                </h1>
                <p class="text-zinc-400">Restaurant Management System</p>
            </div>

            <div class="space-y-4">
                <!-- Visitor Registration -->
                <div data-tab="register" class="glass p-8 rounded-2xl">
                    <h2 class="text-xl font-bold text-white mb-6">Visitor Registration</h2>
                    <form data-form="register" class="space-y-4">
                        <input type="text" data-field="name" placeholder="Full Name" required aria-label="Full Name">
                        <input type="tel" data-field="phone" placeholder="+243..." required aria-label="Phone Number">
                        <button type="submit" class="w-full bg-rose-600 hover:bg-rose-700 text-white font-bold py-3 rounded-xl transition-all">
                            Register
                        </button>
                    </form>
                </div>

                <!-- Visitor Login -->
                <div data-tab="login" class="glass p-8 rounded-2xl">
                    <h2 class="text-xl font-bold text-white mb-6">Visitor Login</h2>
                    <form data-form="login" class="space-y-4">
                        <input type="tel" data-field="phone" placeholder="+243..." required aria-label="Phone Number">
                        <button type="submit" class="w-full bg-rose-600 hover:bg-rose-700 text-white font-bold py-3 rounded-xl transition-all">
                            Login
                        </button>
                    </form>
                </div>

                <!-- Admin Login -->
                <div data-tab="admin-login" class="glass p-8 rounded-2xl">
                    <h2 class="text-xl font-bold text-white mb-6">Admin Access</h2>
                    <form data-form="admin-login" class="space-y-4">
                        <input type="text" data-field="username" placeholder="Username" required aria-label="Admin Username">
                        <input type="password" data-field="password" placeholder="Password" required aria-label="Admin Password">
                        <button type="submit" class="w-full bg-rose-600 hover:bg-rose-700 text-white font-bold py-3 rounded-xl transition-all">
                            Admin Login
                        </button>
                    </form>
                </div>
            </div>
        </div>
    </div>

    <!--========== MAIN LAYOUT ==========-->
    <div data-section="main-layout" class="hidden lg:grid grid-cols-5 gap-4 min-h-screen p-4">

        <!--========== SIDEBAR ==========-->
        <aside id="sidebar" class="lg:col-span-1 glass rounded-2xl p-6 lg:sticky lg:top-4 lg:h-fit">
            <div class="mb-8">
                <h1 class="text-2xl font-bold text-white">
                    <i class="fas fa-utensils text-rose-600 mr-2"></i>Opulence
                </h1>
            </div>

            <nav class="space-y-2" role="navigation" aria-label="Main navigation">
                <button data-nav-btn data-tab="home" class="w-full text-left px-4 py-3 rounded-xl nav-btn" aria-label="Home">
                    <i class="fas fa-home mr-3"></i>Home
                </button>
                <button data-nav-btn data-tab="visitor-orders" class="visitor-only w-full text-left px-4 py-3 rounded-xl nav-btn" aria-label="My Orders">
                    <i class="fas fa-box mr-3"></i>My Orders
                </button>
                <button data-nav-btn data-tab="admin-dash" class="admin-only hidden w-full text-left px-4 py-3 rounded-xl nav-btn" aria-label="Dashboard">
                    <i class="fas fa-chart-line mr-3"></i>Dashboard
                </button>
                <button data-nav-btn data-tab="admin-menu" class="admin-only hidden w-full text-left px-4 py-3 rounded-xl nav-btn" aria-label="Menu Management">
                    <i class="fas fa-list mr-3"></i>Menu
                </button>
                <button data-nav-btn data-tab="admin-inv" class="admin-only hidden w-full text-left px-4 py-3 rounded-xl nav-btn" aria-label="Inventory">
                    <i class="fas fa-warehouse mr-3"></i>Inventory
                </button>
                <button data-nav-btn data-tab="admin-orders" class="admin-only hidden w-full text-left px-4 py-3 rounded-xl nav-btn" aria-label="Orders">
                    <i class="fas fa-receipt mr-3"></i>Orders
                </button>
            </nav>

            <button data-logout class="w-full text-left px-4 py-3 rounded-xl text-zinc-400 hover:text-red-500 transition-all mt-6" aria-label="Logout">
                <i class="fas fa-sign-out-alt mr-3"></i>Logout
            </button>
        </aside>

        <!--========== MAIN CONTENT ==========-->
        <main class="lg:col-span-4 space-y-6">

            <!--========== HOME / MENU ==========-->
            <section data-section="home" class="hidden">
                <div class="flex flex-col md:flex-row justify-between items-start md:items-center gap-4 mb-6">
                    <h2 class="text-3xl font-bold text-white">Menu</h2>
                    <div class="flex flex-col md:flex-row gap-2 w-full md:w-auto">
                        <select data-category-filter class="glass px-4 py-2 rounded-xl" aria-label="Filter by category">
                            <option value="all">All</option>
                            <option value="repas">Meals</option>
                            <option value="boisson">Drinks</option>
                            <option value="dessert">Desserts</option>
                            <option value="entree">Appetizers</option>
                        </select>
                        <input type="text" data-search-input placeholder="Search..." class="glass px-4 py-2 rounded-xl flex-1" aria-label="Search products">
                    </div>
                </div>

                <div id="product-grid" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-4">
                    <!-- Products will be rendered here -->
                </div>
            </section>

            <!--========== CHECKOUT ==========-->
            <section data-section="checkout" class="hidden">
                <h2 class="text-3xl font-bold text-white mb-6">Checkout</h2>
                <div class="grid md:grid-cols-3 gap-6">
                    <div class="md:col-span-2">
                        <form data-form="checkout" class="glass rounded-2xl p-6 space-y-4">
                            <input type="text" data-field="customer-name" placeholder="Your Name" required aria-label="Customer Name">
                            <input type="tel" data-field="customer-phone" placeholder="Phone Number" required aria-label="Phone Number">
                            <textarea data-field="notes" placeholder="Special notes..." aria-label="Order Notes"></textarea>
                            <button type="submit" class="w-full bg-rose-600 hover:bg-rose-700 text-white font-bold py-3 rounded-xl">
                                Place Order
                            </button>
                        </form>
                    </div>
                    <div>
                        <div class="glass rounded-2xl p-6 sticky top-4">
                            <h3 class="text-lg font-bold text-white mb-4">Order Summary</h3>
                            <div id="checkout-summary" class="space-y-2 mb-4">
                                <!-- Summary will be rendered here -->
                            </div>
                            <div class="border-t border-zinc-700 pt-4">
                                <div class="flex justify-between">
                                    <span class="font-bold">Total:</span>
                                    <span data-cart-total class="text-xl font-bold text-rose-600">$0.00</span>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>
            </section>

            <!--========== USER ORDERS ==========-->
            <section data-section="visitor-orders" class="hidden">
                <h2 class="text-3xl font-bold text-white mb-6">My Orders</h2>
                <div id="user-orders" class="space-y-4">
                    <!-- User orders will be rendered here -->
                </div>
            </section>

            <!--========== ADMIN DASHBOARD ==========-->
            <section data-section="admin-dash" class="hidden">
                <h2 class="text-3xl font-bold text-white mb-6">Dashboard</h2>
                <div id="dashboard-stats" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-4 gap-4">
                    <!-- Stats cards will be rendered here -->
                </div>
            </section>

            <!--========== ADMIN MENU MANAGEMENT ==========-->
            <section data-section="admin-menu" class="hidden">
                <div class="flex justify-between items-center mb-6">
                    <h2 class="text-3xl font-bold text-white">Menu Management</h2>
                    <button onclick="UIModule.navigate('admin-menu-edit')" class="bg-rose-600 hover:bg-rose-700 text-white font-bold px-6 py-2 rounded-xl">
                        + Add Product
                    </button>
                </div>
                <div id="products-list" class="glass rounded-2xl overflow-auto">
                    <!-- Products list will be rendered here -->
                </div>
            </section>

            <!--========== ADMIN PRODUCT FORM ==========-->
            <section data-section="admin-menu-edit" class="hidden">
                <h2 class="text-3xl font-bold text-white mb-6">Edit Product</h2>
                <form data-form="product" class="glass rounded-2xl p-6 space-y-4">
                    <input type="hidden" data-field="id">
                    <input type="text" data-field="name" placeholder="Product Name" required aria-label="Product Name">
                    <select data-field="type" required aria-label="Product Type">
                        <option value="">Select Type</option>
                        <option value="repas">Meal</option>
                        <option value="boisson">Drink</option>
                        <option value="dessert">Dessert</option>
                        <option value="entree">Appetizer</option>
                    </select>
                    <input type="number" data-field="price" placeholder="Price" step="0.01" required aria-label="Price">
                    <input type="number" data-field="stock" placeholder="Current Stock" required aria-label="Current Stock">
                    <input type="number" data-field="stock-max" placeholder="Max Stock" required aria-label="Max Stock">
                    <textarea data-field="desc" placeholder="Description" aria-label="Description"></textarea>
                    <input type="url" data-field="image" placeholder="Image URL" required aria-label="Image URL">
                    <div class="flex gap-4">
                        <button type="submit" class="flex-1 bg-rose-600 hover:bg-rose-700 text-white font-bold py-3 rounded-xl">
                            Save
                        </button>
                        <button type="button" onclick="UIModule.navigate('admin-menu')" class="flex-1 bg-zinc-700 hover:bg-zinc-600 text-white font-bold py-3 rounded-xl">
                            Cancel
                        </button>
                    </div>
                </form>
            </section>

            <!--========== ADMIN INVENTORY ==========-->
            <section data-section="admin-inv" class="hidden">
                <h2 class="text-3xl font-bold text-white mb-6">Inventory</h2>
                <div id="inventory-table" class="glass rounded-2xl overflow-auto">
                    <!-- Inventory table will be rendered here -->
                </div>
            </section>

            <!--========== ADMIN ORDERS ==========-->
            <section data-section="admin-orders" class="hidden">
                <h2 class="text-3xl font-bold text-white mb-6">All Orders</h2>
                <div id="all-orders" class="space-y-4">
                    <!-- All orders will be rendered here -->
                </div>
            </section>

        </main>

    </div>

</div>

<!--========== TOAST NOTIFICATIONS ==========-->
<div id="toast-container" class="fixed top-4 right-4 z-50"></div>

<!--========== SCRIPTS ==========-->
<!-- Load scripts in order: config → utils → state → api → modules → ui → app -->
<script src="/js/config.js"></script>
<script src="/js/utils.js"></script>
<script src="/js/state.js"></script>
<script src="/js/api.js"></script>
<script src="/js/auth.js"></script>
<script src="/js/cart.js"></script>
<script src="/js/products.js"></script>
<script src="/js/orders.js"></script>
<script src="/js/admin.js"></script>
<script src="/js/ui.js"></script>
<script src="/js/app.js"></script>

</body>
</html>
